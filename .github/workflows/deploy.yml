name: Deploy

# Tras un CI en verde sobre main: publica las imágenes en GHCR (etiquetadas con el SHA del commit
# y con latest) y, si la variable de repositorio DEPLOY_ENABLED es "true", despliega en el VPS.
#
# Configuración (Settings → Environments → production):
#   secretos  SSH_HOST, SSH_USER, SSH_KEY (clave privada), SSH_KNOWN_HOSTS (salida de ssh-keyscan)
#   variables DEPLOY_PATH (por defecto /opt/mynews), PUBLIC_URL (p. ej. https://mynews.example.com)
# En el VPS debe existir $DEPLOY_PATH/backend/.env con los secretos de la app.
#
# Para volver a una versión anterior: Actions → Deploy → Run workflow con el SHA a desplegar.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA del commit a desplegar (vacío = el último de main)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar imágenes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - id: sha
        run: echo "tag=${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-news-${{ matrix.component }}:${{ steps.sha.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/my-news-${{ matrix.component }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Desplegar en el VPS
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mynews' }}
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Preparar SSH (con verificación del host)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copiar la configuración de infraestructura
        run: rsync -az -e "ssh -i ~/.ssh/id_deploy" infra/ "$TARGET:$DEPLOY_PATH/infra/"
      - name: Actualizar los contenedores
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            "cd $DEPLOY_PATH && export IMAGE_TAG=$TAG && \
             docker compose -f infra/docker-compose.prod.yml pull && \
             docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans && \
             docker image prune -f"
      - name: Comprobar que la API responde
        if: vars.PUBLIC_URL != ''
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "${{ vars.PUBLIC_URL }}/api/health" && exit 0
            sleep 5
          done
          echo "La API no respondió tras el despliegue" >&2
          exit 1
