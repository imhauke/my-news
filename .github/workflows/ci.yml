name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mynews
          POSTGRES_PASSWORD: mynews
          POSTGRES_DB: mynews_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mynews" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mynews:mynews@localhost:5432/mynews_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Migrations apply from scratch with no drift from the models
        env:
          DATABASE_URL: postgresql+asyncpg://mynews:mynews@localhost:5432/mynews_test
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def reset():
              e = create_async_engine("postgresql+asyncpg://mynews:mynews@localhost:5432/mynews_test")
              async with e.begin() as c:  # asyncpg runs one statement per call
                  await c.execute(text("DROP SCHEMA public CASCADE"))
                  await c.execute(text("CREATE SCHEMA public"))
          asyncio.run(reset())
          PY
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
